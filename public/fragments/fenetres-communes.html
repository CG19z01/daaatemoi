<!-- Éléments partagés par la page de création et la page invitée : barre
     d'outils, bandeau de placement et fenêtres. Écrits une seule fois, insérés
     par fenetres-communes.js avant tout branchement. -->
<div class="barre-doutils" role="group" aria-label="Outils de la carte">
  <div class="groupe-doutils">
    <button class="outil" type="button" id="boutonFeutre" aria-pressed="true">Feutre</button>
    <button class="outil" type="button" id="boutonColoriage" aria-pressed="false">Coloriage</button>
    <button class="outil" type="button" id="boutonTexte" aria-pressed="false">Texte</button>
    <button class="outil" type="button" id="boutonGomme" aria-pressed="false">Gomme</button>
  </div>
  <div class="groupe-doutils">
    <button class="outil outil-rond" type="button" id="boutonReduireLeTrait" aria-label="Trait plus fin">−</button>
    <span class="cadre-des-couleurs">
      <button class="outil outil-couleur" type="button" id="boutonDeLaCouleur" aria-label="Couleur du feutre et du coloriage"></button>
      <input class="champ-de-la-couleur" type="color" id="roueChromatique" value="#a30dad" tabindex="-1" aria-hidden="true" />
    </span>
    <button class="outil outil-rond" type="button" id="boutonAgrandirLeTrait" aria-label="Trait plus épais">+</button>
    <span class="apercu-du-trait" id="apercuDuTrait" role="img"></span>
  </div>
  <div class="groupe-doutils groupe-de-sauvegarde">
    <button class="outil" type="button" id="boutonSauvegarder">Sauvegarder</button>
  </div>
</div>

<p class="message-carte" id="messageCarte" role="status" hidden></p>

<div class="bandeau-de-placement" id="bandeauDePlacement" hidden>
  <p id="intituleDuPlacement">Touche la carte à l'endroit voulu.</p>
  <button class="bouton bouton-contour" type="button" id="annulerLePlacement">Annuler</button>
</div>

<dialog class="fenetre" id="fenetreDeRecherche">
  <form id="formulaireDeRecherche">
    <h2>Chercher un lieu</h2>
    <label for="champRecherche">Nom du lieu, ou type de lieu</label>
    <input id="champRecherche" type="search" maxlength="40" placeholder="Cathédrale, musée, parc, bar…" />
    <div class="actions">
      <button class="bouton bouton-plein" type="submit">Chercher</button>
      <button class="bouton bouton-contour" type="button" id="ajouterALaMain">Ajouter à la main</button>
    </div>
    <p class="message" id="messageDeRecherche" role="status"></p>
    <div class="resultats-de-recherche" id="resultatsDeRecherche"></div>
    <div class="actions">
      <button class="bouton bouton-contour" type="button" id="annulerLaRecherche">Fermer</button>
    </div>
  </form>
</dialog>

<dialog class="fenetre fenetre-large" id="fenetreDesHoraires">
  <form id="formulaireDesHoraires" method="dialog">
    <h2 id="titreDesHoraires">Horaires</h2>
    <p class="indication">Corrige-les librement, ou laisse « Non renseignés ».</p>
    <ul class="liste-des-horaires" id="listeDesHoraires"></ul>
    <div class="actions">
      <button class="bouton bouton-contour" type="button" id="annulerLesHoraires">Annuler</button>
      <button class="bouton bouton-plein" type="submit">Enregistrer</button>
    </div>
  </form>
</dialog>

<dialog class="fenetre" id="fenetreDeCreneau">
  <form id="formulaireDuCreneau" method="dialog">
    <h2 id="titreDuCreneau">Nouveau créneau</h2>
    <label for="champDateDuCreneau">Date</label>
    <input id="champDateDuCreneau" type="date" required />
    <label for="champLieuDuCreneau">Lieu</label>
    <select id="champLieuDuCreneau"></select>
    <label for="champHeureDeDebut">De</label>
    <div class="paire-dheure">
      <select id="champHeureDeDebut" aria-label="Heure de début"></select>
      <span>:</span>
      <select id="champMinuteDeDebut" aria-label="Minutes de début"></select>
    </div>
    <label for="champHeureDeFin">À</label>
    <div class="paire-dheure">
      <select id="champHeureDeFin" aria-label="Heure de fin"></select>
      <span>:</span>
      <select id="champMinuteDeFin" aria-label="Minutes de fin"></select>
    </div>
    <p class="message" id="messageDuCreneau" role="status"></p>
    <div class="actions">
      <button class="bouton bouton-contour" type="button" id="annulerLeCreneau">Annuler</button>
      <button class="bouton bouton-plein" type="submit" id="validerLeCreneau">Valider</button>
    </div>
  </form>
</dialog>

<dialog class="fenetre" id="fenetreDuTexte">
  <form id="formulaireDuTexte" method="dialog">
    <h2>Texte sur la carte</h2>
    <label for="champDuTexte">Ton texte</label>
    <input id="champDuTexte" type="text" maxlength="120" placeholder="Rendez-vous ici !" />
    <label for="boutonCouleurDuTexte">Couleur du texte</label>
    <span class="cadre-des-couleurs">
      <button class="outil outil-couleur" type="button" id="boutonCouleurDuTexte" aria-label="Couleur du texte"></button>
      <input class="champ-de-la-couleur" type="color" id="champCouleurDuTexte" value="#000000" tabindex="-1" aria-hidden="true" />
    </span>
    <label for="champTailleDuTexte">Taille</label>
    <input id="champTailleDuTexte" type="range" min="10" max="64" step="2" value="20" />
    <div class="actions">
      <button class="bouton bouton-contour" type="button" id="annulerLeTexte">Annuler</button>
      <button class="bouton bouton-contour" type="button" id="supprimerLeTexte">Supprimer</button>
      <button class="bouton bouton-plein" type="submit">Enregistrer</button>
    </div>
  </form>
</dialog>
