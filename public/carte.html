<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Viens on se date !</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='4' width='24' height='24' fill='none' stroke='black' stroke-width='4'/></svg>" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/carte.css" />
    <link rel="stylesheet" href="/styles/marqueurs.css" />
    <link rel="stylesheet" href="/styles/fiche.css" />
    <link rel="stylesheet" href="/styles/fenetres.css" />
    <link rel="stylesheet" href="/styles/outils.css" />
    <link rel="stylesheet" href="/styles/menus.css" />
    <link rel="stylesheet" href="/styles/annotations.css" />
  </head>
  <body class="page-carte">
    <div class="scene" id="scene">
      <canvas id="canvasCarte" class="couche"></canvas>
      <canvas id="canvasColoration" class="couche couche-coloration"></canvas>
      <div class="couche couche-marqueurs" id="coucheMarqueurs"></div>
    </div>

    <div class="barre-doutils" role="group" aria-label="Outils de dessin">
      <div class="groupe-doutils">
        <button class="outil" type="button" id="boutonFeutre" aria-pressed="true">Feutre</button>
        <button class="outil" type="button" id="boutonGomme" aria-pressed="false">Gomme</button>
      </div>
      <div class="groupe-doutils">
        <button class="outil outil-rond" type="button" id="boutonReduireLeTrait" aria-label="Trait plus fin">−</button>
        <span class="cadre-des-couleurs">
          <button class="outil outil-couleur" type="button" id="boutonDeLaCouleur" aria-label="Couleur du feutre"></button>
          <input
            class="champ-de-la-couleur"
            type="color"
            id="roueChromatique"
            value="#a30dad"
            tabindex="-1"
            aria-hidden="true"
          />
        </span>
        <button class="outil outil-rond" type="button" id="boutonAgrandirLeTrait" aria-label="Trait plus épais">+</button>
        <span class="apercu-du-trait" id="apercuDuTrait" role="img"></span>
      </div>
      <div class="groupe-doutils">
        <button class="outil" type="button" id="boutonSauvegarder">Sauvegarder</button>
      </div>
    </div>

    <p class="message-carte" id="messageCarte" role="status" hidden></p>

    <div class="bandeau-de-placement" id="bandeauDePlacement" hidden>
      <p>Touche la carte à l'endroit que tu proposes.</p>
      <button class="bouton bouton-contour" type="button" id="annulerLePlacement">Annuler</button>
    </div>

    <aside class="annotation annotation-outils">
      <svg class="fleche fleche-vers-les-outils" viewBox="0 0 60 46" aria-hidden="true" focusable="false">
        <path d="M56 42C38 44 14 36 8 14" />
        <path d="M4 4l4 12 12-5" />
      </svg>
      <div class="bulle">
        <p>Utilise le feutre pour dessiner et la gomme pour effacer</p>
        <button class="fermer-annotation" type="button" aria-label="Fermer cette explication">×</button>
      </div>
    </aside>

    <aside class="annotation annotation-lieux">
      <div class="bulle">
        <p>Clique sur le lieu qui t'intéresse&nbsp;!</p>
        <button class="fermer-annotation" type="button" aria-label="Fermer cette explication">×</button>
      </div>
      <svg class="fleche fleche-vers-les-lieux" viewBox="0 0 46 60" aria-hidden="true" focusable="false">
        <path d="M8 4C6 24 14 42 34 52" />
        <path d="M42 56l-12-3 3-11" />
      </svg>
    </aside>

    <aside class="fiche" id="fiche" hidden>
      <button class="fermer" type="button" id="fermerFiche" aria-label="Fermer la fiche">×</button>
      <h2 id="ficheNom"></h2>
      <p class="fiche-activite" id="ficheActivite"></p>
      <dl class="fiche-details" id="ficheHoraires"></dl>
      <p class="fiche-cuisine" id="ficheCuisine" hidden></p>
      <button class="bouton bouton-contour fiche-action" type="button" id="voirLaCarte">Voir la carte</button>
      <button class="bouton bouton-plein fiche-action" type="button" id="reserverIci">Réserver ici</button>
    </aside>

    <button class="bouton-flottant" type="button" id="boutonAutreEndroit">Autre endroit</button>

    <dialog class="fenetre fenetre-de-la-carte" id="fenetreDeLaCarte">
      <h2 id="titreDeLaCarte"></h2>
      <img class="image-de-la-carte" id="imageDeLaCarte" alt="" />
      <div class="actions">
        <button class="bouton bouton-contour" type="button" id="fermerLaCarte">Fermer</button>
      </div>
    </dialog>

    <dialog class="fenetre" id="fenetreAutreEndroit">
      <form method="dialog" id="formulaireAutreEndroit">
        <h2>Autre endroit</h2>
        <label for="champLieuPropose">Lieu</label>
        <input id="champLieuPropose" type="text" maxlength="80" placeholder="Le nom du lieu" required />
        <label for="champDateProposee">Date</label>
        <input id="champDateProposee" type="date" required />
        <label for="champHeureProposee">Heure</label>
        <input id="champHeureProposee" type="time" required />
        <label for="boutonCouleurDuPoint">Couleur du point</label>
        <span class="cadre-des-couleurs">
          <button class="outil outil-couleur" type="button" id="boutonCouleurDuPoint" aria-label="Couleur du point"></button>
          <input class="champ-de-la-couleur" type="color" id="champCouleurDuPoint" value="#a30dad" tabindex="-1" aria-hidden="true" />
        </span>
        <button class="bouton bouton-contour bouton-placement" type="button" id="boutonPlacerSurLaCarte">Placer sur la carte</button>
        <p class="message" id="messageProposition" role="status"></p>
        <div class="actions">
          <button class="bouton bouton-contour" type="button" id="annulerProposition">Annuler</button>
          <button class="bouton bouton-plein" type="submit" id="boutonProposer">Proposer</button>
        </div>
      </form>
    </dialog>

    <dialog class="fenetre" id="fenetreReservation">
      <form method="dialog" id="formulaireReservation">
        <h2>Mon rendez-vous</h2>
        <label for="champLieu">Lieu</label>
        <select id="champLieu" name="identifiantDuLieu" required></select>
        <label for="champDate">Date</label>
        <input id="champDate" name="dateDeReservation" type="date" required />
        <label for="champHeure">Heure</label>
        <input id="champHeure" name="heureDeReservation" type="time" required />
        <p class="message" id="messageReservation" role="status"></p>
        <div class="actions">
          <button class="bouton bouton-contour" type="button" id="annulerReservation">Annuler</button>
          <button class="bouton bouton-plein" type="submit">Valider</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/scripts/carte/principal.js"></script>
  </body>
</html>
